<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal Video PIBG SKBUD4</title>
<meta name="description" content="Video panduan ibu bapa daripada PIBG SK Bandar Utama Damansara 4: tonton, salin ayat dan kongsi.">
<meta property="og:title" content="Portal Video PIBG SKBUD4">
<meta property="og:description" content="Video panduan ibu bapa: tonton dan kongsi terus ke WhatsApp, Instagram, Facebook, TikTok dan Threads.">
<meta property="og:image" content="https://yahyakarim-bpg.github.io/pibg-skbud4-video/thumbs/t34.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
 --paper:#F6EFE2;--sheet:#FFFDF8;--ink:#1B2A4A;--muted:#5E6779;--line:#E6DCCB;--chip:#EFE6D4;
 --blue:#2F6FED;--red:#E8384F;--yellow:#FFC93C;--green:#2BB673;--purple:#9C6ADE;
 --wa:#1FA855;--ig:#D6336C;--fb:#1877F2;--th:#1B2A4A;--tt:#111;
 --shadow:0 2px 0 rgba(90,60,30,.10),0 14px 30px rgba(70,45,20,.12);
 --display:'Baloo 2',ui-rounded,system-ui,sans-serif;--body:Poppins,system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141B2B;--sheet:#1C2539;--ink:#EEF1F7;--muted:#A3ACBF;--line:#2C3650;--chip:#26304A;--th:#EEF1F7;--blue:#5B8DF5;--red:#F05468;--shadow:0 2px 0 rgba(0,0,0,.3),0 14px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141B2B;--sheet:#1C2539;--ink:#EEF1F7;--muted:#A3ACBF;--line:#2C3650;--chip:#26304A;--th:#EEF1F7;--blue:#5B8DF5;--red:#F05468;--shadow:0 2px 0 rgba(0,0,0,.3),0 14px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--body)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:1180px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 19px/1 var(--display);min-width:0}
.brand img{width:40px;height:40px}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{text-decoration:none;font:600 14px var(--body);padding:8px 13px;border-radius:999px}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:34px 0 10px}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h1{font:800 clamp(32px,5.4vw,56px)/1.02 var(--display);margin:.3em 0 .25em;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}
.lead{color:var(--muted);max-width:56ch;margin:0 0 18px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;text-decoration:none;font:700 15px var(--body);padding:12px 18px;border-radius:14px;background:var(--blue);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.btn.sm{font-size:13px;padding:8px 13px;border-radius:10px}
.stack{position:relative;height:360px}
.stack img{position:absolute;width:42%;aspect-ratio:9/16;object-fit:cover;border-radius:18px;box-shadow:var(--shadow);border:6px solid var(--sheet);background:var(--chip)}
.stack img:nth-child(1){left:4%;top:30px;transform:rotate(-7deg)}
.stack img:nth-child(2){left:29%;top:0;z-index:2}
.stack img:nth-child(3){left:54%;top:34px;transform:rotate(6deg)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.stat{background:var(--sheet);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);font:600 14px var(--body)}
.stat b{font:800 22px/1 var(--display);margin-right:6px;font-variant-numeric:tabular-nums}
h2.sec{font:800 28px/1.1 var(--display);margin:34px 0 4px}
p.secsub{color:var(--muted);margin:0 0 14px}
/* series tiles */
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.tile{background:var(--sheet);border-radius:20px;box-shadow:var(--shadow);padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:6px;border-top:6px solid var(--c)}
.tile b{font:800 20px/1.15 var(--display)}
.tile span{color:var(--muted);font-size:13.5px}
.tile .n{font:800 13px var(--body);color:var(--c)}
/* video grid */
.tools{position:sticky;top:61px;z-index:10;background:var(--paper);padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 240px;min-width:0;border:2px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 14px;font:500 15px var(--body);color:var(--ink)}
.f{border:0;background:var(--chip);font:600 13.5px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.f[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,190px),1fr));gap:16px}
.vc{background:var(--sheet);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;min-width:0}
.vc .th{position:relative;aspect-ratio:9/16;background:var(--chip)}
.vc .th img{width:100%;height:100%;object-fit:cover;display:block}
.vc .num{position:absolute;top:8px;left:8px;background:var(--c);color:#fff;font:800 14px var(--display);border-radius:999px;padding:2px 10px}
.vc .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font:600 11.5px var(--body);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}
.vc .tx{padding:10px 12px 14px}
.vc .tx small{font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vc .tx b{display:block;font:700 15px/1.25 var(--display);margin-top:2px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
/* detail */
.back{display:inline-flex;margin:20px 0 6px;text-decoration:none;font:600 14px var(--body);color:var(--muted)}
.det{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:26px;align-items:start}
.det video{width:100%;aspect-ratio:9/16;border-radius:20px;background:#000;display:block;box-shadow:var(--shadow)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill{font:600 12px var(--body);padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted);font-variant-numeric:tabular-nums}
.det h2{font:800 clamp(26px,3.6vw,36px)/1.08 var(--display);margin:4px 0 8px;text-wrap:balance}
.keyfact{background:var(--sheet);border-left:6px solid var(--green);border-radius:12px;padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.note{font-size:13px;background:color-mix(in srgb,var(--yellow) 22%,var(--sheet));border-radius:10px;padding:8px 12px;margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tab{border:0;cursor:pointer;font:600 13px var(--body);padding:7px 12px;border-radius:10px;background:var(--chip)}
.tab[aria-selected="true"]{color:#fff;background:var(--pc)}
pre.cap{white-space:pre-wrap;word-break:break-word;font:400 14px/1.6 var(--body);background:var(--sheet);border-radius:14px;padding:16px;margin:10px 0 0;max-height:340px;overflow:auto;box-shadow:var(--shadow)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts .chars{color:var(--muted);font-size:12px;margin-right:auto;font-variant-numeric:tabular-nums}
.btn.ok{background:var(--green)}
.navv{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
/* schedule */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.day{background:var(--sheet);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.day h3{font:800 18px/1.2 var(--display);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.day h3 span{font:600 12px var(--body);color:var(--muted)}
.slot{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot input{width:20px;height:20px;accent-color:var(--green)}
.slot a{text-decoration:none;font:600 14px/1.3 var(--body)}
.slot small{grid-column:2;color:var(--muted);font-size:12px}
.slot.done a{text-decoration:line-through;color:var(--muted)}
.prog{height:12px;background:var(--chip);border-radius:999px;overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;background:var(--green);border-radius:999px}
/* about */
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.cards3 div{background:var(--sheet);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.cards3 h3{font:800 18px/1.2 var(--display);margin:0 0 6px}
.cards3 p{margin:0;color:var(--muted);font-size:14px}
footer{margin-top:44px;color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font:600 14px var(--body);transition:transform .25s;z-index:50}
.toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.stack{height:260px;max-width:420px}.det{grid-template-columns:1fr}.det video{max-width:300px;margin:0 auto}.tools{top:101px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="top"><div class="in">
 <a class="brand" href="#/"><img src="logo.png" alt="">PIBG SKBUD4</a>
 <nav class="nav" aria-label="Utama">
  <a href="#/" data-r="home">Utama</a><a href="#/video" data-r="video">Video</a><a href="#/jadual" data-r="jadual">Jadual</a><a href="#/tentang" data-r="tentang">Tentang</a>
 </nav>
</div></header>
<div class="wrap"><main id="app" aria-live="polite"><p class="empty">Memuatkan video…</p></main>
<footer>Dibawakan oleh PIBG SK Bandar Utama Damansara 4</footer></div>
<div class="toast" id="toast" role="status"></div>
<script>
const BASE='';
const INFRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const SER={1:['Siri 1','Panduan asas ibu bapa','var(--blue)'],2:['Siri 2','Isu sekolah & keselamatan','var(--red)'],3:['Isu Semasa','KP2027, Tahun 1 & polemik terkini','var(--purple)'],4:['Bantuan KPM','BAP, KWAPM, RMT, elaun & lain-lain','var(--green)']};
const PL={wa:['💬','WhatsApp','var(--wa)'],wa2:['😜','WA Santai','var(--wa)'],ig:['📸','Instagram','var(--ig)'],fb:['👍','Facebook','var(--fb)'],tt:['🎵','TikTok','var(--tt)'],th:['🧵','Threads','var(--th)']};
const OPEN={wa:t=>'https://wa.me/?text='+encodeURIComponent(t),wa2:t=>'https://wa.me/?text='+encodeURIComponent(t),th:t=>'https://www.threads.net/intent/post?text='+encodeURIComponent(t),fb:()=>'https://www.facebook.com/',ig:()=>'https://www.instagram.com/',tt:()=>'https://www.tiktok.com/upload'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const vurl=n=>BASE+'videos/v'+pad(n)+'.mp4', turl=n=>BASE+'thumbs/t'+pad(n)+'.jpg';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const app=document.getElementById('app'), toast=document.getElementById('toast');
let DATA=[], st={q:'',s:store.get('siri','0')};
function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('on'),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}}
const vcard=v=>`<a class="vc" href="#/video/${v.n}" style="--c:${SER[v.s][2]}"><div class="th"><img loading="lazy" src="${turl(v.n)}" alt=""><span class="num">${v.n}</span><span class="dur">${v.dur}s</span></div><div class="tx"><small>${SER[v.s][0]}</small><b>${esc(v.t)}</b></div></a>`;

function home(){
 const latest=[...DATA].sort((a,b)=>b.n-a.n).slice(0,4), hs=[...DATA].sort((a,b)=>b.n-a.n).slice(0,3);
 const cnt=s=>DATA.filter(v=>v.s==s).length;
 app.innerHTML=`<section class="hero"><div><div class="eyebrow">Panduan Ibu Bapa · PIBG SK Bandar Utama Damansara 4</div>
  <h1>Info sekolah, <em>ringkas & jelas</em> dalam video 1 minit</h1>
  <p class="lead">${DATA.length} video panduan untuk ibu bapa: bantuan KPM, KP2027, Tahun 1, keselamatan dan banyak lagi. Tonton, salin ayat kongsian, dan sebarkan ke WhatsApp, Instagram, Facebook, TikTok dan Threads.</p>
  <div class="cta"><a class="btn" href="#/video">▶ Tonton semua video</a><a class="btn alt" href="#/jadual">🗓️ Jadual pos</a></div></div>
  <div class="stack" aria-hidden="true">${hs.map(v=>`<img src="${turl(v.n)}" alt="">`).join('')}</div></section>
  <div class="stats"><div class="stat"><b style="color:var(--blue)">${DATA.length}</b>video</div><div class="stat"><b style="color:var(--green)">4</b>siri</div><div class="stat"><b style="color:var(--red)">6</b>platform</div><div class="stat"><b style="color:var(--purple)">&lt;10 MB</b>setiap video</div></div>
  <h2 class="sec">Terbaharu</h2><p class="secsub">Video paling baru dalam portal.</p><div class="grid">${latest.map(vcard).join('')}</div>
  <h2 class="sec">Siri video</h2><p class="secsub">Pilih topik yang anda perlukan.</p>
  <div class="series">${Object.entries(SER).map(([k,s])=>`<a class="tile" href="#/video" data-siri="${k}" style="--c:${s[2]}"><span class="n">${cnt(k)} video</span><b>${s[0]}</b><span>${s[1]}</span></a>`).join('')}</div>`;
 app.querySelectorAll('.tile').forEach(a=>a.addEventListener('click',()=>{st.s=a.dataset.siri;store.set('siri',st.s)}));
}

function list(){
 app.innerHTML=`<h2 class="sec">Semua video</h2><p class="secsub">Cari ikut tajuk atau topik, kemudian tekan video untuk tonton dan dapatkan ayat kongsian.</p>
 <div class="tools"><input class="search" type="search" placeholder="Cari: BAP, Tahun 1, buli, elaun…" aria-label="Cari video" value="${esc(st.q)}">
 <button class="f" data-s="0">Semua</button>${Object.entries(SER).map(([k,s])=>`<button class="f" data-s="${k}">${s[0]}</button>`).join('')}<span class="count"></span></div>
 <div class="grid" id="g"></div>`;
 const g=app.querySelector('#g'), q=app.querySelector('.search'), c=app.querySelector('.count');
 const draw=()=>{const w=st.q.toLowerCase().trim();
  const vs=DATA.filter(v=>(st.s==='0'||String(v.s)===st.s)&&(!w||(v.t+' '+v.key+' '+v.ig).toLowerCase().includes(w)));
  app.querySelectorAll('.f').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===st.s));
  g.innerHTML=vs.length?vs.map(vcard).join(''):'<p class="empty">Tiada video sepadan. Cuba kata kunci lain.</p>';c.textContent=vs.length+' video'};
 q.addEventListener('input',()=>{st.q=q.value;draw()});
 app.querySelectorAll('.f').forEach(b=>b.addEventListener('click',()=>{st.s=b.dataset.s;store.set('siri',st.s);draw()}));
 draw();
}

function detail(n){
 const i=DATA.findIndex(v=>v.n==n); if(i<0){app.innerHTML='<p class="empty">Video tidak dijumpai. <a href="#/video">Kembali</a></p>';return}
 const v=DATA[i], prev=DATA[i-1], next=DATA[i+1]; let cur='wa', file=null, loading=null;
 const canShareFiles=!INFRAME&&navigator.canShare&&navigator.share;
 app.innerHTML=`<a class="back" href="#/video">← Semua video</a>
 <div class="det"><div><video controls playsinline preload="metadata" poster="${turl(v.n)}" src="${vurl(v.n)}" aria-label="Video ${v.n}"></video>
  <div class="pills"><span class="pill">${v.dur} saat</span><span class="pill">${v.mb} MB</span><span class="pill">9:16</span><span class="pill">🗓️ ${esc(v.when)}</span></div>
  <div class="acts"><a class="btn sm alt" href="${vurl(v.n)}" download="PIBG_SKBUD4_v${pad(v.n)}.mp4" target="_blank" rel="noopener">⬇ Muat turun video</a>${canShareFiles?'<button class="btn sm" id="vs">📤 Kongsi video + ayat</button>':''}</div></div>
 <div><div class="eyebrow" style="color:${SER[v.s][2]}">${SER[v.s][0]} · Video ${v.n}</div><h2>${v.e} ${esc(v.t)}</h2>
  <p class="keyfact"><b>Fakta utama:</b> ${esc(v.key)}</p>${v.note?`<p class="note">Nota: ${esc(v.note)}</p>`:''}
  <div class="tabs" role="tablist" aria-label="Platform">${Object.entries(PL).map(([p,x])=>`<button class="tab" role="tab" data-p="${p}" style="--pc:${x[2]}">${x[0]} ${x[1]}</button>`).join('')}</div>
  <pre class="cap" tabindex="0"></pre>
  <div class="acts"><span class="chars"></span><button class="btn sm" id="cp">Salin ayat</button><a class="btn sm alt" id="op" target="_blank" rel="noopener"></a></div>
  ${INFRAME?'<p class="note" style="margin-top:12px">Untuk kongsi video terus dari telefon, buka portal penuh: <a href="https://yahyakarim-bpg.github.io/pibg-skbud4-video/#/video/'+v.n+'" target="_blank" rel="noopener">yahyakarim-bpg.github.io/pibg-skbud4-video</a></p>':''}</div></div>
 <div class="navv">${prev?`<a class="btn alt sm" href="#/video/${prev.n}">← ${prev.n}. ${esc(prev.t)}</a>`:'<span></span>'}${next?`<a class="btn alt sm" href="#/video/${next.n}">${next.n}. ${esc(next.t)} →</a>`:''}</div>`;
 const pre=app.querySelector('pre'), ch=app.querySelector('.chars'), cp=app.querySelector('#cp'), op=app.querySelector('#op');
 const show=p=>{cur=p;pre.textContent=v[p];ch.textContent=v[p].length+' aksara';app.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.p===p));op.href=OPEN[p](v[p]);op.textContent=(['wa','wa2','th'].includes(p)?'Buka ':'Salin & buka ')+PL[p][1]+' ↗';cp.textContent='Salin ayat';cp.classList.remove('ok')};
 app.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.p)));
 cp.addEventListener('click',async()=>{if(await copy(v[cur])){cp.textContent='Disalin ✓';cp.classList.add('ok');say('Ayat disalin')}else say('Tekan lama pada teks untuk salin')});
 op.addEventListener('click',()=>{copy(v[cur])});
 const vs=app.querySelector('#vs');
 if(vs){const prep=()=>loading||(loading=fetch(vurl(v.n)).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>file=new File([b],'PIBG_SKBUD4_v'+pad(v.n)+'.mp4',{type:'video/mp4'})).catch(e=>{loading=null;throw e}));
  app.querySelector('video').addEventListener('play',()=>prep().catch(()=>{}));
  vs.addEventListener('click',async()=>{copy(v[cur]);
   if(!file){vs.disabled=true;vs.textContent='Menyediakan video…';try{await prep()}catch(e){vs.disabled=false;vs.textContent='Gagal, cuba lagi';return}vs.disabled=false;vs.textContent='📤 Tekan sekali lagi untuk kongsi';return}
   const d={files:[file],text:v[cur]};if(!navigator.canShare(d)){say('Peranti ini tidak menyokong kongsi video. Guna Muat turun.');return}
   try{await navigator.share(d);vs.textContent='📤 Kongsi video + ayat'}catch(e){}})}
 show('wa'); window.scrollTo(0,0);
}

function jadual(){
 const done=store.get('done',{}); const byDay={}; DATA.forEach(v=>(byDay[v.day]=byDay[v.day]||[]).push(v));
 const nDone=()=>DATA.filter(v=>done[v.n]).length;
 const first=DATA[0].when.split(',')[0], last=DATA[DATA.length-1].when.split(',')[0];
 app.innerHTML=`<h2 class="sec">Jadual pos · 3 video sehari</h2><p class="secsub">${esc(first)} hingga ${esc(last)}, pukul 8:00 pagi, 1:00 tengah hari dan 8:30 malam. Tanda disimpan dalam pelayar anda sahaja.</p>
 <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${DATA.length}" aria-valuenow="${nDone()}"><i style="width:${nDone()/DATA.length*100}%"></i></div>
 <p class="secsub" id="pt">${nDone()} daripada ${DATA.length} sudah dipos</p>
 <div class="days">${Object.entries(byDay).map(([d,vs])=>`<div class="day"><h3>Hari ${d} <span>${esc(vs[0].when.split(',')[0])}</span></h3>${vs.map(v=>`<label class="slot${done[v.n]?' done':''}"><input type="checkbox" data-n="${v.n}" ${done[v.n]?'checked':''}><a href="#/video/${v.n}">${v.e} ${v.n}. ${esc(v.t)}</a><small>${esc(v.when.split(', ')[1])}</small></label>`).join('')}</div>`).join('')}</div>`;
 app.querySelector('.days').addEventListener('change',e=>{const n=e.target.dataset.n;if(!n)return;done[n]=e.target.checked;store.set('done',done);e.target.closest('.slot').classList.toggle('done',e.target.checked);
  const k=nDone();app.querySelector('.prog i').style.width=k/DATA.length*100+'%';app.querySelector('.prog').setAttribute('aria-valuenow',k);app.querySelector('#pt').textContent=k+' daripada '+DATA.length+' sudah dipos'});
}

function route(){
 const h=location.hash.replace(/^#\/?/,''), [r,id]=h.split('/');
 const key=r||'home'; document.querySelectorAll('.nav a').forEach(a=>a.dataset.r===key?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 if(!DATA.length)return;
 if(key==='video'&&id)detail(+id);else if(key==='video')list();else if(key==='jadual')jadual();else if(key==='tentang')tentang();else home();
 if(!(key==='video'&&id))window.scrollTo(0,0);
}
document.addEventListener('play',e=>{document.querySelectorAll('video').forEach(x=>{if(x!==e.target)x.pause()})},true);
window.addEventListener('hashchange',route);
fetch(BASE+'data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{DATA=d;route()}).catch(()=>{app.innerHTML='<p class="empty">Gagal memuatkan senarai video. Semak sambungan internet dan muat semula.</p>'});
route();
</script></body></html>
